[package]
name = "xtask"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = { workspace = true }
glob = "0.3.1"
strum = { version = "0.28", features = ["derive"] }
tracel-xtask = { version = "=5.0.0", features = ["bump", "compile", "coverage", "dependencies", "fix", "publish", "validate", "vulnerabilities", "build", "check", "doc", "test", "utils-helpers"] }
# ### For local development. ###
# tracel-xtask = { path = "../../xtask/crates/tracel-xtask", default-features = false }

[dev-dependencies]
rstest = { workspace = true }
