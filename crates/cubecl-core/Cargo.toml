[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeCL core create"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubecl-core"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-core"
version.workspace = true


[lints]
workspace = true


[features]
amd = ["cubecl-ir/amd"]
default = ["cubecl-runtime/default", "cubecl-ir/default"]
export_tests = ["tempfile", "test-log/trace", "test-log/log", "std"]
nvidia = ["cubecl-ir/nvidia"]
persistence = ["cubecl-runtime/persistence"]
std = ["cubecl-runtime/std", "pliron/std", "cubecl-environment/std"]
template = []
tokio = ["cubecl-runtime/tokio"]

tracing = ["dep:tracing", "cubecl-runtime/tracing", "cubecl-ir/tracing"]

[dependencies]
# Runtime Deps
log = { workspace = true }
test-log = { workspace = true, optional = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

cubecl-ir = { workspace = true, features = [
    "serde",
] }
cubecl-runtime = { workspace = true }
cubecl-zspace = { workspace = true, default-features = true }

bitflags = { workspace = true }
bytemuck = { workspace = true }
cubecl-common = { workspace = true }
cubecl-environment = { workspace = true }
cubecl-macros = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true }
float-ord = { workspace = true }
half = { workspace = true, features = ["bytemuck"] }
hashbrown = { workspace = true }
num-complex = { workspace = true }
itertools = { workspace = true }
num-traits = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
variadics_please = { workspace = true }

pliron = { workspace = true }

[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }
trybuild = "1"
