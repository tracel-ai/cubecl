[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "CUDA runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "cuda"]
license.workspace = true
name = "cubecl-cuda"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-cuda"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "cubecl-server/default",
    "cubecl-common/default",
    "cubecl-core/default",
]
pliron-dump = ["cubecl-cpp/pliron-dump"]
ptx-wmma = []
std = [
    "cubecl-server/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-cpp/std",
]

tracing = [
    "dep:tracing",
    "cubecl-server/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]


[dependencies]
# Runtime Deps
log = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

bytemuck = { workspace = true }
cubecl-common = { path = "../cubecl-common", version = "=0.11.0-pre.3", default-features = false, features = [
    "hash",
] }
cubecl-environment = { path = "../cubecl-environment", version = "=0.11.0-pre.3", default-features = false }
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.3", default-features = false }
cubecl-cpp = { path = "../cubecl-cpp", version = "=0.11.0-pre.3", default-features = false, features = [
    "cuda",
] }
cubecl-server = { path = "../cubecl-server", version = "=0.11.0-pre.3", default-features = false, features = [
    "std",
    "cuda",
] }
cudarc = { workspace = true }

derive-new = { workspace = true }
half = { workspace = true }
serde = { workspace = true }


[dev-dependencies]
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.3", features = [
    "export_tests",
] }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.3", features = [
    "export_tests",
] }
paste = { workspace = true }
test-log = { workspace = true, features = ["trace"] }

[build-dependencies]
cudarc = { workspace = true }
