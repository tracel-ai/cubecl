[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
    "maxtremblay <t.maxime@pm.me>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeCL Standard Library."
edition.workspace = true
keywords = []
license.workspace = true
name = "cubecl-std"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-std"
version.workspace = true


[lints]
workspace = true


[features]
default = []
export_tests = ["test-log/trace"]

tracing = [
    "cubecl-common/tracing",
    "cubecl-core/tracing",
    "cubecl-runtime/tracing",
]


[dependencies]
test-log = { workspace = true, optional = true }

cubecl-common = { workspace = true, features = [
    "hash",
    "fp4",
    "fp8",
] }
cubecl-environment = { workspace = true }
cubecl-core = { workspace = true }
cubecl-runtime = { workspace = true }
half.workspace = true
num-traits = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
variadics_please = { workspace = true }

# no_std compat
spin = { workspace = true }


[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }
