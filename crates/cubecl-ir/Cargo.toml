[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com",
]
categories = ["science"]
description = "Intermediate representation for CubeCL"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubecl-ir"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-ir"
version.workspace = true


[lints]
workspace = true


[features]
amd = []
default = ["serde"]
nvidia = []

serde = ["dep:serde", "hashbrown/serde"]
spirv = ["dep:pliron-spirv"]
tracing = ["cubecl-common/tracing"]

[dependencies]
cubecl-common = { workspace = true, features = [
    "fp8",
    "hash",
] }
cubecl-environment = { workspace = true }
cubecl-macros-internal = { workspace = true, default-features = true }

pliron = { workspace = true }
pliron-spirv = { workspace = true, optional = true }
rustc_apfloat = { workspace = true }

bumpalo = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true, features = ["from", "eq"] }
float-ord = { workspace = true }
foldhash = { workspace = true }
half = { workspace = true }
internment = { workspace = true, features = ["intern", "serde"] }
itertools = { workspace = true }
num-complex = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, optional = true, features = ["rc"] }
smallvec = { workspace = true }
spin = { workspace = true }
thiserror = { workspace = true }
variadics_please = { workspace = true }

hashbrown = { workspace = true }
portable-atomic = { workspace = true }
