[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "CPP transpiler for CubeCL"
edition.workspace = true
keywords = ["cpp", "gpu", "cuda", "hip", "metal"]
license.workspace = true
name = "cubecl-cpp"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-cpp"
version.workspace = true


[lints]
workspace = true


[features]
cuda = []
default = [
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
    "metal",
]
hip = []
metal = []
pliron-dump = ["std"]
std = [
    "cubecl-runtime/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-opt/std",
    "pliron/std",
]

tracing = [
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
    "cubecl-opt/tracing",
]

[dependencies]
cubecl-common = { workspace = true }
cubecl-core = { workspace = true, features = [
    "amd",
] }
cubecl-environment = { workspace = true }
# For shared allocation
cubecl-opt = { workspace = true }
cubecl-runtime = { workspace = true, features = [
    "channel-mutex",
] }

bytemuck = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true }
half = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
num-traits = { workspace = true }
paste = { workspace = true }
pliron = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cubecl-core = { workspace = true, default-features = true, features = [
    "export_tests",
] }
