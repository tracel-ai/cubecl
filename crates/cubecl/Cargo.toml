[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "Multi-platform high-performance compute language extension for Rust."
edition.workspace = true
keywords = ["gpu", "cuda", "wgpu", "gpgpu", "tensor"]
license.workspace = true
name = "cubecl"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl"
version.workspace = true


[lints]
workspace = true


[features]
autotune-checks = ["cubecl-runtime/autotune-checks"]
default = ["std", "stdlib", "cubecl-core/default"]
std = ["cubecl-core/std"]
stdlib = ["cubecl-std"] # CubeCL standard library
template = ["cubecl-core/template"]

profile-tracy = ["cubecl-runtime/profile-tracy"]

browser-cache = ["cubecl-core/browser-cache"]
tokio = ["cubecl-core/tokio"]

tracing = ["cubecl-core/tracing"]

# The runtimes are not here. This crate is what a kernel library compiles
# against, and it stays free of every runtime so that an edit to one rebuilds
# no kernel. A binary picks its runtimes through `cubecl-dispatch`.

[dependencies]
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.3", default-features = false }
cubecl-environment = { path = "../cubecl-environment", version = "=0.11.0-pre.3", default-features = false }
cubecl-ir = { path = "../cubecl-ir", version = "=0.11.0-pre.3", default-features = false }
cubecl-runtime = { path = "../cubecl-runtime", version = "=0.11.0-pre.3", default-features = false }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.3", optional = true }
half = { workspace = true }
