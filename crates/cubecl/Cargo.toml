[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "Multi-platform high-performance compute language extension for Rust."
edition.workspace = true
keywords = ["gpu", "cuda", "wgpu", "gpgpu", "tensor"]
license.workspace = true
name = "cubecl"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl"
version.workspace = true


[lints]
workspace = true


[features]
autotune-checks = ["cubecl-runtime/autotune-checks"]
default = [
    "std",
    "stdlib",
    "cubecl-core/default",
    "cubecl-cuda?/default",
    "cubecl-cpu?/default",
    "cubecl-hip?/default",
    "cubecl-metal?/default",
    "cubecl-wgpu?/default",
]
std = [
    "cubecl-core/std",
    "cubecl-cpu?/std",
    "cubecl-cuda?/std",
    "cubecl-hip?/std",
    "cubecl-metal?/std",
    "cubecl-wgpu?/std",
]
stdlib = ["cubecl-std"] # CubeCL standard library
template = ["cubecl-core/template"]

exclusive-memory-only = ["cubecl-wgpu?/exclusive-memory-only"]

profile-tracy = ["cubecl-runtime/profile-tracy", "cubecl-wgpu?/profile-tracy"]

persistence = [
    "cubecl-runtime/persistence",
    "cubecl-cpu?/persistence",
    "cubecl-cuda?/persistence",
    "cubecl-hip?/persistence",
    "cubecl-metal?/persistence",
    "cubecl-wgpu?/persistence",
]
tokio = ["cubecl-core/tokio"]

tracing = [
    "cubecl-core/tracing",
    "cubecl-cuda?/tracing",
    "cubecl-cpu?/tracing",
    "cubecl-hip?/tracing",
    "cubecl-wgpu?/tracing",
]

# Runtimes. A kernel library depends on this crate with none of them on and
# compiles against no runtime at all; a binary turns on the ones it links.
cpu = ["cubecl-cpu"]
cuda = ["cubecl-cuda"]
cuda-cpp = ["cubecl-cuda?/cpp"]
cuda-ptx-wmma = ["cubecl-cuda?/ptx-wmma"]
hip = ["cubecl-hip"]
# Compile HIP kernels with the C++ backend instead of the default LLVM one.
hip-cpp = ["cubecl-hip?/cpp"]
hip-rocwmma = ["cubecl-hip?/rocwmma"]
metal = ["wgpu-msl"]
metal-native = ["cubecl-metal"]
pliron-dump = [
    "cubecl-cuda?/pliron-dump",
    "cubecl-hip?/pliron-dump",
    "cubecl-metal?/pliron-dump",
    "cubecl-wgpu?/pliron-dump",
    "cubecl-cpu?/pliron-dump",
]
rocm = ["hip"]
vulkan = ["wgpu-spirv"]
webgpu = ["wgpu"]
wgpu = ["cubecl-wgpu"]
wgpu-msl = ["wgpu", "cubecl-wgpu/msl"]
wgpu-spirv = ["wgpu", "cubecl-wgpu/spirv"]

# The runtime tests run on: wgpu unless exactly one other runtime is enabled.
test-runtime = ["wgpu"]

[dependencies]
cubecl-core = { workspace = true }
cubecl-environment = { workspace = true }
cubecl-ir = { workspace = true }
cubecl-runtime = { workspace = true }
cubecl-std = { workspace = true, default-features = true, optional = true }
half = { workspace = true }

cubecl-cpu = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-hip = { workspace = true, optional = true }
cubecl-metal = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
