[package]
authors = ["dcvz <david@dcvz.io>"]
categories = ["science"]
description = "Metal runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "metal"]
license.workspace = true
name = "cubecl-metal"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-metal"
version.workspace = true

[features]
default = ["std"]
pliron-dump = ["cubecl-cpp/pliron-dump"]
persistence = ["cubecl-server/persistence"]
std = [
    "cubecl-server/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-cpp/std",
]

[dependencies]
cubecl-common = { workspace = true }
cubecl-environment = { workspace = true }
cubecl-core = { workspace = true }
cubecl-ir = { workspace = true }
cubecl-monitoring = { workspace = true, features = [
    "io-accelerator",
] }
cubecl-server = { workspace = true }
cubecl-cpp = { workspace = true, default-features = true, features = ["metal"] }

# Utilities
log = { workspace = true }
derive-new = { workspace = true }
hashbrown = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
serde = { workspace = true }

# Metal bindings only exist on Apple platforms. Keeping them in a target table
# means other platforms never even download them, so workspace-wide builds and
# clippy work everywhere (the crate itself is empty off-Apple, see lib.rs).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["block2", "MTLLibrary", "objc2-core-foundation"] }
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
cubecl-core = { workspace = true, default-features = true, features = ["export_tests"] }
cubecl-std = { workspace = true, default-features = true, features = ["export_tests"] }
test-log = { workspace = true, features = ["trace"] }
paste = { workspace = true }

[lints]
workspace = true
