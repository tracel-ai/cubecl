[package]
authors = ["marcantoinem <marc-antoine.m@outlook.com>"]
categories = ["science"]
description = "CPU runtime for CubeCL"
edition.workspace = true
keywords = ["cpu"]
license.workspace = true
name = "cubecl-cpu"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-cpu"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
    "cubecl-llvm/default",
]

pliron-dump = ["cubecl-llvm/pliron-dump"]
std = [
    "cubecl-runtime/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-llvm/std",
]

tracing = [
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
    "cubecl-llvm/tracing",
]


[dependencies]
cubecl-common = { path = "../cubecl-common", version = "=0.11.0-pre.2", default-features = false, features = [
    "std",
] }
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.2", default-features = false, features = [
    "std",
] }
cubecl-environment = { path = "../cubecl-environment", version = "=0.11.0-pre.2", default-features = false }
cubecl-llvm = { path = "../cubecl-llvm", version = "=0.11.0-pre.2", default-features = false }
cubecl-runtime = { path = "../cubecl-runtime", version = "=0.11.0-pre.2", default-features = false, features = [
    "channel-mutex",
    "std",
    "storage-bytes",
] }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.2", default-features = false }


crossbeam-utils = "0.8.21"
derive-new = { workspace = true }
log = { workspace = true }
pliron = { workspace = true, features = ["std"] }
spin = { workspace = true, features = ["mutex", "spin_mutex"] }
sysinfo = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "freebsd"))'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { workspace = true }

[dev-dependencies]
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.2", features = [
    "export_tests",
] }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.2", features = [
    "export_tests",
] }
half = { workspace = true }
paste = { workspace = true }
pretty_assertions = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
