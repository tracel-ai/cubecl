[package]
authors = []
edition.workspace = true
license.workspace = true
name = "fusing"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
# An example with no runtime linked has nothing to run on, so the
# portable one is the default. `--no-default-features --features cuda`
# (or hip, cpu, metal) picks another.
cuda = ["cubecl/cuda"]
default = ["wgpu"]
wgpu = ["cubecl/wgpu"]

[dependencies]
cubecl = { workspace = true }
half = { workspace = true }
