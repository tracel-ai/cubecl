[package]
authors = []
name = "fusing"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# An example with no runtime linked has nothing to run on, so the
# portable one is the default. `--no-default-features --features cuda`
# (or hip, cpu, metal-native) picks another.
default = ["wgpu"]
wgpu = ["cubecl/wgpu"]
cuda = ["cubecl/cuda"]

[dependencies]
cubecl = { path = "../../crates/cubecl", version = "=0.11.0-pre.3", default-features = false }
half = { workspace = true }
