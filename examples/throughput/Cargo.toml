[package]
authors = []
name = "throughput"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# An example with no runtime linked has nothing to run on, so the
# portable one is the default. `--no-default-features --features cuda`
# (or hip, cpu, metal) picks another.
default = ["wgpu"]

# wgpu family — all use `WgpuRuntime`; the sub-feature selects the compiler backend.
wgpu = ["cubecl/wgpu"] # WGSL
vulkan = ["wgpu", "cubecl/vulkan"] # SPIR-V
wgpu-msl = ["wgpu", "cubecl/wgpu-msl"] # MSL (via wgpu)
webgpu = ["wgpu", "cubecl/webgpu"]

# Native backends.
# `cuda` runs the LLVM backend, `cuda-cpp` the transpiler through NVRTC -- the same
# split as `hip`/`hip-cpp`, and the point of comparison between the two paths.
cuda = ["cubecl/cuda"]
cuda-cpp = ["cuda", "cubecl/cuda-cpp"]
hip = ["cubecl/hip"]
rocm = ["hip"]
cpu = ["cubecl/cpu"]
metal = ["cubecl/metal"]

[dependencies]
cubecl = { workspace = true, default-features = true, features = ["stdlib"] }
half = { workspace = true }
