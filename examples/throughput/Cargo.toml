[package]
authors = []
name = "throughput"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []

# wgpu family — all use `WgpuRuntime`; the sub-feature selects the compiler backend.
wgpu = ["cubecl-dispatch/wgpu"] # WGSL
vulkan = ["wgpu", "cubecl-dispatch/vulkan"] # SPIR-V
metal = ["wgpu", "cubecl-dispatch/metal"] # MSL (via wgpu)
webgpu = ["wgpu", "cubecl-dispatch/webgpu"]

# Native backends.
cuda = ["cubecl-dispatch/cuda"]
hip = ["cubecl-dispatch/hip"]
rocm = ["hip"]
cpu = ["cubecl-dispatch/cpu"]
metal-native = ["cubecl-dispatch/metal-native"]

[dependencies]
cubecl = { path = "../../crates/cubecl", version = "=0.11.0-pre.3", features = ["stdlib"] }
cubecl-dispatch = { path = "../../crates/cubecl-dispatch", version = "=0.11.0-pre.3", default-features = false }
half = { workspace = true }
