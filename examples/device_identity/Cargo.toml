[package]
authors = []
edition.workspace = true
license.workspace = true
name = "device_identity"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
# Vulkan and DirectX 12 are both wgpu, so the default reaches every GPU API but CUDA and ROCm.
# `--features cuda,rocm` adds them.
default = ["wgpu"]
wgpu = ["cubecl/wgpu"]
# Also reads a Vulkan card's LUID on Windows.
cuda = ["cubecl/cuda"]
rocm = ["cubecl/rocm"]
vulkan = ["cubecl/vulkan"]

[dependencies]
cubecl = { workspace = true, default-features = true }
