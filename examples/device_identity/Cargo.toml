[package]
authors = []
name = "device_identity"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Vulkan and DirectX 12 are both wgpu, so the default reaches every GPU API but CUDA.
# `--features cuda` adds it.
default = ["vulkan"]
vulkan = ["cubecl/vulkan"]
cuda = ["cubecl/cuda"]

[dependencies]
cubecl = { path = "../../crates/cubecl", version = "=0.11.0-pre.4" }
