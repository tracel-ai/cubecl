[package]
authors = []
name = "execution"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# An example with no runtime linked has nothing to run on, so the
# portable one is the default. `--no-default-features --features cuda`
# (or hip, cpu) picks another.
default = ["wgpu"]
wgpu = ["cubecl/wgpu"]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]
cpu = ["cubecl/cpu"]

[dependencies]
cubecl = { workspace = true, default-features = true }
