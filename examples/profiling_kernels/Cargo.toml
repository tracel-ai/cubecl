[package]
authors = []
edition.workspace = true
license.workspace = true
name = "profiling_kernels"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
# An example with no runtime linked has nothing to run on, so the
# portable one is the default. `--no-default-features --features cuda`
# (or hip, cpu, metal) picks another.
cpu = ["cubecl/cpu"]
cuda = ["cubecl/cuda"]
default = ["wgpu"]
hip = ["cubecl/hip"]
wgpu = ["cubecl/wgpu"]

[dependencies]
cubecl = { workspace = true, default-features = true }
